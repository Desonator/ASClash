name: Build ASClash packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release tag (for example v4.8.2.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: OpenWrt ${{ matrix.version }} (${{ matrix.pkg_format }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "24.10.8"
            pkg_format: "ipk"
            arch: "x86/64"
          - version: "25.12.6"
            pkg_format: "apk"
            arch: "x86/64"

    env:
      PACKAGE_NAME: luci-app-asclash
      SDK_URL_PATH: https://downloads.openwrt.org/releases/${{ matrix.version }}/targets/${{ matrix.arch }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext libncurses5-dev rsync xsltproc build-essential gawk unzip zstd

      - name: Validate source and run project tests
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            install-asclash.sh \
            luci-app-asclash/rootfs/etc/init.d/clash \
            luci-app-asclash/rootfs/etc/hotplug.d/iface/40-clash \
            luci-app-asclash/rootfs/etc/hotplug.d/net/99-clash-tun \
            luci-app-asclash/rootfs/opt/clash/bin/clash-rules \
            luci-app-asclash/rootfs/opt/clash/bin/asclash-api \
            luci-app-asclash/rootfs/opt/clash/bin/asclash-reload \
            tests/*.sh; do
            sh -n "$script"
          done

          while IFS= read -r source; do
            node --check "$source"
          done < <(find luci-app-asclash/rootfs/www/luci-static/resources/view/asclash -type f -name '*.js' ! -path '*/ace/*')
          node --check tests/test-managed-direct-rule-edit.js
          node --check tests/test-kernel-install.js
          node --check tests/test-localization-parity.js
          node --check tests/test-api-helper-acl.js
          node --check tests/test-config-apply-guard.js

          node tests/test-localization-parity.js
          node tests/test-managed-direct-rule-edit.js
          node tests/test-kernel-install.js
          node tests/test-api-helper-acl.js
          node tests/test-config-apply-guard.js
          for test in tests/*.sh; do sh "$test"; done
          msgfmt --check -o /dev/null luci-app-asclash/rootfs/po/ru/asclash.po
          msgfmt --check -o /dev/null luci-app-asclash/rootfs/po/zh-cn/asclash.po

          node -e 'JSON.parse(require("fs").readFileSync("luci-app-asclash/rootfs/usr/share/rpcd/acl.d/luci-app-asclash.json", "utf8")); JSON.parse(require("fs").readFileSync("luci-app-asclash/rootfs/usr/share/luci/menu.d/luci-app-asclash.json", "utf8"));'

      - name: Create SDK directories
        run: |
          echo "SDK_DL_DIR=$(mktemp -d)" >> "$GITHUB_ENV"
          echo "SDK_HOME=$(mktemp -d)" >> "$GITHUB_ENV"

      - name: Download and verify OpenWrt SDK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDK_DL_DIR"

          if ! curl -fsSL "$SDK_URL_PATH/sha256sums" \
            | awk '$2 ~ /^\*?openwrt-sdk-/ && $2 ~ /\.tar\.zst$/ { print; found=1; exit } END { if (!found) exit 1 }' \
            > sha256sums.sdk; then
            echo "Could not find an OpenWrt SDK checksum for $SDK_URL_PATH" >&2
            exit 1
          fi

          SDK_FILE="$(awk '{ name = $2; sub(/^\*/, "", name); print name; exit }' sha256sums.sdk)"
          if [[ -z "$SDK_FILE" ]]; then
            echo "SDK checksum entry did not contain a filename" >&2
            exit 1
          fi

          echo "Downloading $SDK_FILE"
          curl -fL --retry 3 --connect-timeout 20 "$SDK_URL_PATH/$SDK_FILE" -o "$SDK_FILE"
          sha256sum -c sha256sums.sdk
          tar --zstd -xf "$SDK_FILE" -C "$SDK_HOME" --strip-components=1

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDK_HOME"
          ./scripts/feeds update
          ./scripts/feeds install -a

          package_path="package/$PACKAGE_NAME"
          if [[ -e "$package_path" || -L "$package_path" ]]; then
            echo "SDK already contains $package_path; refusing to overwrite it" >&2
            exit 1
          fi
          ln -s "$GITHUB_WORKSPACE/$PACKAGE_NAME" "$package_path"

          printf 'CONFIG_PACKAGE_%s=m\n' "$PACKAGE_NAME" >> .config
          make defconfig
          if ! grep -q "^CONFIG_PACKAGE_${PACKAGE_NAME}=m$" .config; then
            echo "Kconfig did not select $PACKAGE_NAME for compilation" >&2
            exit 1
          fi
          make "package/$PACKAGE_NAME/compile" V=s

          mapfile -t built_packages < <(find "$SDK_HOME/bin/packages" -type f \
            \( -name "${PACKAGE_NAME}_*.${{ matrix.pkg_format }}" \
            -o -name "${PACKAGE_NAME}-*.${{ matrix.pkg_format }}" \))
          if [[ ${#built_packages[@]} -eq 0 ]]; then
            echo "No package with the expected format was produced" >&2
            exit 1
          fi

          cp -v "${built_packages[@]}" "$GITHUB_WORKSPACE/"
          printf 'Copied packages:\n'
          printf ' - %s\n' "${built_packages[@]##*/}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-openwrt-${{ matrix.version }}-${{ matrix.pkg_format }}
          path: "*.${{ matrix.pkg_format }}"
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files and notes
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "Invalid release tag '$RELEASE_TAG'; expected vX.Y.Z or vX.Y.Z.N" >&2
            exit 1
          fi

          mkdir -p release_files
          find artifacts -type f \
            \( -name '*.ipk' -o -name '*.apk' \) \
            -exec cp -v {} release_files/ \;
          if ! find release_files -maxdepth 1 -type f | grep -q .; then
            echo "No .ipk or .apk assets were downloaded" >&2
            exit 1
          fi

          previous_tag="$(git tag --sort=-creatordate | grep -v -F "$RELEASE_TAG" | head -n 1 || true)"
          {
            echo "## ASClash $RELEASE_TAG"
            echo
            if [[ -n "$previous_tag" ]]; then
              git log --no-merges --pretty='- %s' "$previous_tag..HEAD"
            else
              git log --no-merges --pretty='- %s' -n 30 HEAD
            fi
          } > release_notes.md

      - name: Create release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          tag_name: ${{ inputs.release-tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
